<!DOCTYPE html>
<html>
<head>
    <title>Basic Template</title>
    <style>
        body {
            background-color: lightgray;
            font-family: Arial;
        }
        .container {
            width: 600px;
            height: 400px;
            background-color: white;
            margin: 50px auto;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }
        p {
            color: black;
            font-size: 18px;
        }
        a {
            color: blue;
            text-decoration: none;
            font-size: 16px;
        }

        input[type="text"] {
            width: 250px;
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
        }
        input[type="submit"] {
            background-color: green;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .box {
            width: 150px;
            height: 50px;
            background-color: lightblue;
            float: left;
            margin: 10px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="image.jpg" alt="My Image">
        <h1>Welcome to My Website</h1>
        <p>This is my first HTML and CSS template.</p>
        <a href="https://www.google.com">Visit Google</a>
        <br><br>
        <form>
            <input type="text" placeholder="Enter your name">
            <br>
            <input type="submit" value="Submit">
        </form>
        <br>
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
    </div>
</body>
</html>
